
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#0d0d0d" />

  <title>GOEZ PRODUCER</title>

  <!-- Estilos generales -->
  <link rel="stylesheet" href="css/base.css" />

  <!-- Portada principal -->
  <link rel="stylesheet" href="css/hero.css" />

  <!-- Barra adaptable -->

  <!-- Segunda sección -->

</head>

<body>

  <!-- ==================================
       BARRA DE NAVEGACIÓN GLOBAL
  =================================== -->

  <header class="topbar" id="main-header">

    <a href="index.html"
       class="brand-link"
       aria-label="Inicio">

      <img
        src="assets/logo1.png"
        alt="Logo Goez"
        class="brand-logo glow-white"
      />

    </a>

    <nav class="nav-menu" aria-label="Navegación principal">

      <a href="beats.html" class="nav-item glow-white">
        Beats
      </a>

      <a href="soundpacks.html" class="nav-item glow-white">
        SoundPacks
      </a>

      <a href="comprar.html" class="nav-item glow-white">
        Comprar
      </a>

      <a href="contacto.html" class="nav-item glow-white">
        Contacto
      </a>

    </nav>

  </header>


  <main>

    <!-- ==================================
         SECCIÓN 1: PORTADA OSCURA
    =================================== -->

    <section class="hero-stage" id="inicio">

      <!-- Fondo -->
      <div class="hero-wall" aria-hidden="true"></div>

      <div class="hero-light-right" aria-hidden="true"></div>

      <!-- Piso -->
      <div class="hero-floor-line" aria-hidden="true"></div>

      <div class="hero-floor" aria-hidden="true"></div>

      <!-- Contenido -->
      <div class="hero-content">

        <div class="hero-copy">

          <h1 class="hero-title glow-white">
            GOEZ
          </h1>

          <p class="hero-subtitle glow-accent">
            PRODUCER
          </p>

          <p class="hero-caption glow-white">
            Contenido para artistas y redes sociales
          </p>

        </div>

        <!-- Imagen original -->
        <div class="hero-art-wrap">

          <img
            src="assets/art.png"
            alt="Goez sentado en un cubo"
            class="hero-art"
          />

        </div>

      </div>

    </section>


    <!-- ==================================
         SECCIÓN 2: PRESENTACIÓN DE BEATS
    =================================== -->

    <section class="beat-promo" id="beat-promo">

      <div class="beat-promo-inner">

        <!-- Texto promocional -->
        <div class="promo-content">



          <h2 class="promo-title">

            <span>ENCUENTRA</span>

            <span>
              TU <em>SONIDO</em>
            </span>

          </h2>


          <p class="promo-description">
            Beats originales para llevar tus ideas más lejos.
          </p>


          <a href="beats.html" class="promo-button">

            <span>EXPLORAR BEATS</span>

            <span class="promo-arrow" aria-hidden="true">
              →
            </span>

          </a>

            <svg

              xmlns="http://www.w3.org/2000/svg"
              preserveAspectRatio="none"

        </div>


        <!-- Imagen art2.png -->
        <figure class="promo-art">

          <img
            src="assets/art2.png"
            alt="Retrato de Goez"

  </main>


  <!-- Cambio automático de colores del encabezado -->
  <script src="js/header-theme.js"></script>

</html>
