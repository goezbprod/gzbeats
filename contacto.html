<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070d1b" />
  <meta name="description" content="Conecta con GOEZ PRODUCER en redes sociales y descubre sus beats y contenido para artistas y productores." />
  <title>Contacto | GOEZ PRODUCER</title>

  <!-- Estilos globales del sitio -->
  <link rel="stylesheet" href="css/base.css" />

  <!-- Estilos exclusivos de Contacto -->
  <link rel="stylesheet" href="css/contacto.css" />
</head>
<body class="contact-page">

  <!-- =========================================
       NAVEGACIÓN TRANSPARENTE DEL SITIO
  ========================================== -->
  <header class="contact-header">
    <a class="contact-logo" href="index.html" aria-label="GOEZ PRODUCER - Inicio">
      <img src="assets/logo1.png" alt="GOEZ" />
    </a>

    <nav class="contact-nav" aria-label="Navegación principal">
      <a href="beats.html">Beats</a>
      <a href="soundpacks.html">SoundPacks</a>
      <a href="comprar.html">Comprar</a>
      <a href="contacto.html" aria-current="page">Contacto</a>
    </nav>
  </header>

  <main>
    <section class="contact-hero" aria-label="GOEZ PRODUCER y redes sociales">
      <!-- Iluminación ambiental integrada al fondo, no a la fotografía -->
      <div class="contact-light contact-light-blue" aria-hidden="true"></div>
      <div class="contact-light contact-light-pink" aria-hidden="true"></div>

      <!--
        La imagen se coloca directamente sobre el fondo.
        No tiene tarjeta, borde, marco ni fondo añadido por CSS.
      -->
      <img
        class="contact-art"
        src="assets/art4.png"
        alt="Retrato de GOEZ PRODUCER"
        width="1080"
        height="1080"
        fetchpriority="high"
      />

      <div class="contact-hero-inner">
        <!-- Identidad a la izquierda -->
        <div class="contact-brand">
          <p class="contact-kicker">PRODUCTOR MUSICAL</p>
          <h1 class="contact-brand-title">
            <span class="contact-goez">GOEZ</span>
            <span class="contact-producer">Producer</span>
          </h1>
          <p class="contact-brand-caption">
            Sonidos con identidad.<br />
          </p>
        </div>

        <!-- Mensaje a la derecha -->
        <div class="contact-statement">
          <p class="contact-statement-kicker">TU MÚSICA</p>
          <h2 class="contact-statement-title">SIN<br />LÍMITES.</h2>
          <p class="contact-statement-script">Haz que te escuchen.</p>
          <p class="contact-statement-caption">
          </p>
        </div>
      </div>

      <!-- =========================================
           ENLACES INFERIORES: SIN TARJETAS NI BLOQUE EXTRA
      ========================================== -->
      <nav class="contact-socials" aria-label="Redes sociales de GOEZ PRODUCER">
        <a
          class="contact-social-link"
          href="https://www.tiktok.com/@goez.producer?_r=1&_t=ZS-9Bdd0utpfjp"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="TikTok de GOEZ Producer"
        >
          <img src="assets/icons/tiktok.png" alt="" />
          <span>TIKTOK</span>
        </a>

        <a
          class="contact-social-link"
          href="https://www.instagram.com/goez.producer?hvrq=NWNoZnRuYm1zZ3hv"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram de GOEZ Producer"
        >
          <img src="assets/icons/instagram.png" alt="" />
          <span>INSTAGRAM</span>
        </a>

        <a
          class="contact-social-link"
          href="https://youtube.com/@goezbeats5125?si=Hyu7GY2IFAqWoL9S"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Canal de YouTube GOEZ Beats - Beats e instrumentales"
        >
          <img src="assets/icons/youtube.png" alt="" />
          <span>GOEZ BEATS</span>
        </a>

        <a
          class="contact-social-link"
          href="https://youtube.com/@goezzproducer?si=JVuPacMSU3he7ZJA"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Canal de YouTube GOEZZ Producer - Contenido para artistas y productores"
        >
          <img src="assets/icons/youtube.png" alt="" />
          <span>GOEZZ PRODUCER</span>
        </a>
      </nav>
    </section>
  </main>

</body>
</html>
